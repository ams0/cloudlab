---
- name: Wait for apt locks to be released
  command: >
    timeout 600 sh -c
    'while fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 5; done'
  changed_when: false

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Set timezone
  timezone:
    name: "{{ timezone }}"

- name: Install locales package
  apt:
    name: locales
    state: present

- name: Generate locale
  locale_gen:
    name: "{{ locale }}"
    state: present

- name: Set system locale
  shell: update-locale LANG={{ locale }}
  changed_when: false

- name: Create sudo group
  group:
    name: sudo
    state: present

- name: Add user to sudo group
  user:
    name: "{{ ansible_user }}"
    groups: sudo
    append: yes

- name: Configure sudo without password
  lineinfile:
    path: /etc/sudoers
    line: "{{ ansible_user }} ALL=(ALL) NOPASSWD:ALL"
    validate: 'visudo -cf %s'

- name: Check if swap is enabled
  shell: swapon --show --noheadings
  register: swap_status
  failed_when: false
  changed_when: false

- name: Disable swap if enabled
  shell: swapoff -a
  when: swap_status.stdout != ""

- name: Remove swap entries from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'
  register: fstab_swap_disabled

- name: Disable systemd swap target
  systemd:
    name: swap.target
    enabled: no
    masked: yes
  ignore_errors: yes

- name: Disable any swap services
  shell: systemctl --type swap --all | awk '/\.swap/ { print $1 }' | xargs -r systemctl mask
  changed_when: false
  ignore_errors: yes

- name: Install iptables-persistent
  apt:
    name: iptables-persistent
    state: present
    update_cache: no

- name: Allow HTTP through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 80
    jump: ACCEPT
    comment: "HTTP"
    action: insert
    rule_num: "1"

- name: Allow HTTPS through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 443
    jump: ACCEPT
    comment: "HTTPS"
    action: insert
    rule_num: "1"

- name: Allow port 8000 through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 8000
    jump: ACCEPT
    comment: "Port 8000"
    action: insert
    rule_num: "1"

- name: Allow port 9000 through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 9000
    jump: ACCEPT
    comment: "Port 9000"
    action: insert
    rule_num: "1"

- name: Allow Warpgate SSH (2222) through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 2222
    jump: ACCEPT
    comment: "Warpgate SSH"
    action: insert
    rule_num: "1"

# Trust OpenBao's SSH CA so Warpgate targets can use short-lived certificates
# (key ID warpgate:<user>:<session> shows up in auth.log). Additive: existing
# authorized_keys logins keep working. The cert's principal must equal the
# login user, and the OpenBao role `warpgate` limits which principals it signs.
- name: Install Warpgate SSH CA public key
  copy:
    dest: /etc/ssh/warpgate_ca.pub
    content: "{{ warpgate_ssh_ca_public_key }}\n"
    owner: root
    group: root
    mode: "0644"
  when: warpgate_ssh_ca_public_key | default('') | length > 0
  notify: Reload sshd

- name: Trust Warpgate SSH CA in sshd
  copy:
    dest: /etc/ssh/sshd_config.d/50-warpgate-ca.conf
    content: |
      # Managed by Ansible (roles/common) — see gitops/apps/openbao/README.md
      TrustedUserCAKeys /etc/ssh/warpgate_ca.pub
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: warpgate_ssh_ca_public_key | default('') | length > 0
  notify: Reload sshd

- name: Ensure ufw is disabled
  systemd:
    name: ufw
    state: stopped
    enabled: no
  failed_when: false
  ignore_errors: yes

- name: Increase inotify limits for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: yes
  loop:
    - { name: fs.inotify.max_user_watches, value: "524288" }
    - { name: fs.inotify.max_user_instances, value: "512" }

- name: Save iptables rules
  shell: netfilter-persistent save
  changed_when: false
