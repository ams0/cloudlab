---
- name: Check current Flux CLI version
  shell: /usr/local/bin/flux --version 2>/dev/null | grep -oP 'flux version \K[0-9.]+' || echo "0.0.0"
  register: flux_current_version
  changed_when: false
  failed_when: false

- name: Set version comparison facts
  set_fact:
    flux_target_version: "{{ flux_version | regex_replace('^v', '') }}"
    flux_installed_version: "{{ flux_current_version.stdout }}"

- name: Download Flux CLI
  get_url:
    url: "https://github.com/fluxcd/flux2/releases/download/{{ flux_version }}/flux_{{ flux_version | regex_replace('^v', '') }}_linux_{{ flux_arch }}.tar.gz"
    dest: /tmp/flux.tar.gz
    mode: '0644'
  when: flux_installed_version != flux_target_version
  register: flux_download

- name: Extract Flux CLI
  unarchive:
    src: /tmp/flux.tar.gz
    dest: /tmp/
    remote_src: yes
  when: flux_download is changed

- name: Install/Upgrade Flux CLI
  copy:
    src: /tmp/flux
    dest: /usr/local/bin/flux
    mode: '0755'
    owner: root
    group: root
    remote_src: yes
  when: flux_download is changed

- name: Clean up Flux download files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/flux.tar.gz
    - /tmp/flux
  when: flux_download is changed

- name: Check if Flux is already installed in cluster
  shell: k0s kubectl get namespace {{ flux_namespace }}
  register: flux_namespace_exists
  failed_when: false
  changed_when: false

- name: Install Flux in cluster
  shell: flux install --namespace={{ flux_namespace }} --components-extra=image-reflector-controller,image-automation-controller
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  when: flux_namespace_exists.rc != 0
  register: flux_install

- name: Upgrade Flux in cluster if CLI was upgraded
  shell: flux install --namespace={{ flux_namespace }} --components-extra=image-reflector-controller,image-automation-controller
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  when:
    - flux_namespace_exists.rc == 0
    - flux_installed_version != flux_target_version
  register: flux_upgrade

- name: Wait for Flux pods to be created
  shell: k0s kubectl get pods -n {{ flux_namespace }} -l app.kubernetes.io/part-of=flux --no-headers | wc -l
  register: flux_pods_count
  until: flux_pods_count.stdout | int > 0
  retries: 12
  delay: 5
  when: flux_install.changed or flux_upgrade.changed
  changed_when: false

- name: Wait for Flux controllers to be ready
  shell: k0s kubectl wait --for=condition=ready pod -l app.kubernetes.io/part-of=flux -n {{ flux_namespace }} --timeout=300s
  when: flux_install.changed or flux_upgrade.changed
  register: flux_ready
  retries: 5
  delay: 20
  until: flux_ready.rc == 0

- name: Create GitRepository manifest
  template:
    src: gitrepository.yaml.j2
    dest: "/tmp/gitrepository-{{ flux_git_repository_name }}.yaml"
    mode: '0644'

- name: Apply GitRepository manifest
  shell: k0s kubectl apply -f /tmp/gitrepository-{{ flux_git_repository_name }}.yaml
  register: gitrepo_result
  changed_when: "'configured' in gitrepo_result.stdout or 'created' in gitrepo_result.stdout"

- name: Create Kustomization manifest
  template:
    src: kustomization.yaml.j2
    dest: "/tmp/kustomization-{{ flux_kustomization_name }}.yaml"
    mode: '0644'

- name: Apply Kustomization manifest
  shell: k0s kubectl apply -f /tmp/kustomization-{{ flux_kustomization_name }}.yaml
  register: kustomization_result
  changed_when: "'configured' in kustomization_result.stdout or 'created' in kustomization_result.stdout"

- name: Clean up temporary manifests
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/gitrepository-{{ flux_git_repository_name }}.yaml"
    - "/tmp/kustomization-{{ flux_kustomization_name }}.yaml"

- name: Trigger Flux reconciliation
  # Bounded wait: flux reconcile blocks up to --timeout (default 5m) until the
  # root Kustomization reports healthy. A single failed HelmRelease keeps it
  # unhealthy indefinitely, so the long block on the small ARM VM starved the
  # SSH channel and reddened CI with UNREACHABLE. Cap the wait and tolerate a
  # transient transport drop — Flux reconciles every 10m regardless, and Ansible
  # reopens a fresh connection for the next task.
  shell: flux reconcile kustomization {{ flux_kustomization_name }} --namespace {{ flux_namespace }} --timeout 60s
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  register: flux_reconcile
  failed_when: false
  changed_when: false
  ignore_unreachable: true

- name: Get Flux status
  shell: flux get all -A
  environment:
    KUBECONFIG: /var/lib/k0s/pki/admin.conf
  register: flux_status
  changed_when: false

- name: Display Flux status
  debug:
    msg: "{{ flux_status.stdout_lines }}"

# These namespaces are normally created by Flux reconciling the apps, but
# this role runs immediately after applying the Kustomization — and the
# apps may be commented out of gitops/kustomization.yaml entirely. Create
# them up front, as is already done for omni/tailscale/openclaw/etc.
- name: Create keycloak namespace if not exists
  shell: kubectl create namespace keycloak --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Create forgejo namespace if not exists
  shell: kubectl create namespace forgejo --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if keycloak bootstrap admin secret exists
  shell: kubectl -n keycloak get secret keycloak-bootstrap-admin
  register: keycloak_secret_check
  failed_when: false
  changed_when: false

- name: Create keycloak bootstrap admin secret
  shell: |
    kubectl -n keycloak create secret generic keycloak-bootstrap-admin \
      --from-literal=username=admin \
      --from-literal=password={{ vault_keycloak_admin_password | quote }}
  when:
    - keycloak_secret_check.rc != 0
    - vault_keycloak_admin_password | default('') | trim | length > 0

- name: Warn that the keycloak admin password is unset
  debug:
    msg: >-
      vault_keycloak_admin_password is empty in vault.yml, so the
      keycloak-bootstrap-admin secret was NOT created. Set it with
      'ansible-vault edit group_vars/oracle_hosts/vault.yml' before
      enabling keycloak, or it will bootstrap with a blank admin password.
  when:
    - keycloak_secret_check.rc != 0
    - vault_keycloak_admin_password | default('') | trim | length == 0

- name: Check if forgejo smtp secret exists
  shell: kubectl -n forgejo get secret forgejo-smtp
  register: forgejo_smtp_secret_check
  failed_when: false
  changed_when: false

- name: Create forgejo smtp secret
  shell: |
    kubectl -n forgejo create secret generic forgejo-smtp \
      --from-literal=passwd={{ vault_forgejo_smtp_password | quote }}
  when: forgejo_smtp_secret_check.rc != 0

- name: Check if keycloak smtp secret exists
  shell: kubectl -n keycloak get secret keycloak-smtp
  register: keycloak_smtp_secret_check
  failed_when: false
  changed_when: false

- name: Create keycloak smtp secret
  shell: |
    kubectl -n keycloak create secret generic keycloak-smtp \
      --from-literal=password={{ vault_forgejo_smtp_password | quote }}
  when: keycloak_smtp_secret_check.rc != 0

- name: Create omni namespace if not exists
  shell: kubectl create namespace omni --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if omni etcd encryption key secret exists
  shell: kubectl -n omni get secret omni-etcd-encryption-key
  register: omni_etcd_key_check
  failed_when: false
  changed_when: false

- name: Create omni etcd encryption key secret
  shell: |
    kubectl -n omni create secret generic omni-etcd-encryption-key \
      --from-literal=omni.asc={{ omni_etcd_encryption_key | quote }}
  no_log: true
  when: omni_etcd_key_check.rc != 0

- name: Check if omni OIDC secret exists
  shell: kubectl -n omni get secret omni-oidc
  register: omni_oidc_check
  failed_when: false
  changed_when: false

- name: Create omni OIDC secret
  shell: |
    cat <<'EOF' | kubectl -n omni create secret generic omni-oidc --from-file=config.yaml=/dev/stdin
    auth:
      oidc:
        clientSecret: "{{ omni_oidc_client_secret }}"
    EOF
  no_log: true
  when: omni_oidc_check.rc != 0

- name: Create tailscale namespace if not exists
  shell: kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if tailscale OAuth secret exists
  shell: kubectl -n flux-system get secret tailscale-oauth
  register: tailscale_oauth_check
  failed_when: false
  changed_when: false

- name: Create tailscale OAuth secret
  shell: |
    kubectl -n flux-system create secret generic tailscale-oauth \
      --from-literal=oauth.clientId={{ tailscale_operator_oauth_client_id | quote }} \
      --from-literal=oauth.clientSecret={{ tailscale_operator_oauth_client_secret | quote }}
  no_log: true
  when: tailscale_oauth_check.rc != 0

- name: Create openclaw namespace if not exists
  shell: kubectl create namespace openclaw --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if openclaw env secret exists
  shell: kubectl -n openclaw get secret openclaw-env-secret
  register: openclaw_secret_check
  failed_when: false
  changed_when: false

- name: Create openclaw env secret
  shell: |
    kubectl -n openclaw create secret generic openclaw-env-secret \
      --from-literal=ANTHROPIC_API_KEY={{ vault_openclaw_anthropic_api_key | quote }} \
      --from-literal=OPENCLAW_GATEWAY_TOKEN={{ vault_openclaw_gateway_token | quote }}
  when:
    - openclaw_secret_check.rc != 0
    - vault_openclaw_anthropic_api_key is defined
    - vault_openclaw_gateway_token is defined

- name: Create rustfs namespace if not exists
  shell: kubectl create namespace rustfs --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if rustfs auth secret exists
  shell: kubectl -n rustfs get secret rustfs-auth
  register: rustfs_secret_check
  failed_when: false
  changed_when: false

- name: Create rustfs auth secret
  shell: |
    kubectl -n rustfs create secret generic rustfs-auth \
      --from-literal=RUSTFS_ACCESS_KEY={{ rustfs_access_key | quote }} \
      --from-literal=RUSTFS_SECRET_KEY={{ rustfs_secret_key | quote }}
  no_log: true
  when:
    - rustfs_secret_check.rc != 0
    - rustfs_access_key is defined
    - rustfs_secret_key is defined

- name: Create alarik namespace if not exists
  shell: kubectl create namespace alarik --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if alarik credentials secret exists
  shell: kubectl -n alarik get secret alarik-credentials
  register: alarik_secret_check
  failed_when: false
  changed_when: false

- name: Create alarik credentials secret
  shell: |
    kubectl -n alarik create secret generic alarik-credentials \
      --from-literal=ADMIN_USERNAME={{ alarik_admin_username | quote }} \
      --from-literal=ADMIN_PASSWORD={{ alarik_admin_password | quote }} \
      --from-literal=JWT={{ alarik_jwt_key | quote }} \
      --from-literal=DEFAULT_ACCESS_KEY={{ alarik_default_access_key | quote }} \
      --from-literal=DEFAULT_SECRET_KEY={{ alarik_default_secret_key | quote }}
  no_log: true
  when:
    - alarik_secret_check.rc != 0
    - alarik_admin_password is defined

- name: Create velero namespace if not exists
  shell: kubectl create namespace velero --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if velero S3 credentials secret exists
  shell: kubectl -n velero get secret velero-s3-credentials
  register: velero_secret_check
  failed_when: false
  changed_when: false

- name: Create velero S3 credentials secret
  shell: |
    cat <<'CREDEOF' > /tmp/velero-credentials
    [default]
    aws_access_key_id={{ velero_s3_access_key }}
    aws_secret_access_key={{ velero_s3_secret_key }}
    CREDEOF
    kubectl -n velero create secret generic velero-s3-credentials \
      --from-file=cloud=/tmp/velero-credentials
    rm -f /tmp/velero-credentials
  no_log: true
  when:
    - velero_secret_check.rc != 0
    - velero_s3_access_key is defined
    - velero_s3_secret_key is defined

- name: Create keycloak-operator namespace if not exists
  shell: kubectl create namespace keycloak-operator --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Check if keycloak-operator auth secret exists
  shell: kubectl -n keycloak-operator get secret keycloak-operator-auth
  register: keycloak_operator_secret_check
  failed_when: false
  changed_when: false

# Credentials for the "keycloak-operator" service-account client in the master
# realm. The operator uses the client_credentials grant, so the Keycloak admin
# user's own password never enters the cluster.
- name: Create keycloak-operator auth secret
  shell: |
    kubectl -n keycloak-operator create secret generic keycloak-operator-auth \
      --from-literal=client-secret={{ vault_keycloak_operator_client_secret | quote }}
  no_log: true
  when:
    - keycloak_operator_secret_check.rc != 0
    - vault_keycloak_operator_client_secret is defined
    - vault_keycloak_operator_client_secret | default('') | trim | length > 0
