name: Build Buzz Agent Image

on:
  push:
    branches:
      - main
    paths:
      - 'gitops/apps/buzz-agent/image/**'
      - '.github/workflows/buzz-agent-image.yml'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ams0/buzz-agent-claude

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ams0
          password: ${{ secrets.GHCR_PAT }}

      # arm64 is the one that matters (the cluster node is ARM64); amd64 is
      # built so the image is usable from a laptop for debugging.
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: gitops/apps/buzz-agent/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The HelmRelease/Deployment pins this image by digest, so surface it:
      # the spec requires a digest reference for anything that runs with an nsec.
      - name: Report image digest
        run: |
          echo "### Buzz agent image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
