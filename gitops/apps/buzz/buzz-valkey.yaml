---
# Redis for buzz-pubsub.
#
# The chart marks REDIS_URL optional at replicaCount 1, on the grounds that
# Redis is only needed to fan pub/sub out across pods. In practice the relay
# still dials Redis unconditionally at startup and, with nothing listening,
# retries on a backoff loop forever — so "optional" means the relay boots, not
# that it stops wanting Redis. Rather than serve chat on top of a connection
# that is permanently refused, run one.
#
# Valkey is the Redis-compatible fork: actively maintained and multi-arch, and
# the same choice already made for Outline in this repo. The chart's own bundled
# Redis is an eval-only CloudPirates subchart and is left disabled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buzz-valkey
  namespace: buzz
  labels:
    app: buzz-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buzz-valkey
  template:
    metadata:
      labels:
        app: buzz-valkey
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine # renovate: datasource=docker depName=valkey/valkey
          imagePullPolicy: IfNotPresent
          # Ephemeral pub/sub fan-out only — no persistence, nothing durable to
          # lose on restart. Events live in Postgres, media in the bucket.
          command: ["sh", "-c"]
          args:
            - exec valkey-server --save "" --appendonly no --requirepass "$VALKEY_PASSWORD"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buzz-relay-env
                  key: VALKEY_PASSWORD
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: buzz-valkey
  namespace: buzz
  labels:
    app: buzz-valkey
spec:
  type: ClusterIP
  selector:
    app: buzz-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
