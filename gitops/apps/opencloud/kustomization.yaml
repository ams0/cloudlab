---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opencloud
resources:
  - namespace.yaml
  - opencloud-pvc.yaml
  - opencloud-ldap.yaml
  - opencloud-deployment.yaml
  - opencloud-httproute.yaml

# OpenCloud needs its own LDAP schema (opencloudUUID) and base tree seeded into
# an empty directory. Generated rather than hand-written so the upstream files
# stay byte-identical and diffable against opencloud-compose.
configMapGenerator:
  - name: opencloud-ldap-schema
    files:
      - ldap-files/10_opencloud_schema.ldif
      - ldap-files/10_base.ldif
      - ldap-files/50_acls.ldif

generatorOptions:
  disableNameSuffixHash: true
