---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-operator
  namespace: flux-system
  labels:
    app: keycloak-operator
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: keycloak-operator
  # The operator is useless until Keycloak answers its admin API, and its
  # Keycloak CR reconciles immediately on startup.
  dependsOn:
    - name: keycloak
  chart:
    spec:
      chart: keycloak-operator
      version: "1.35.0"
      sourceRef:
        kind: HelmRepository
        name: keycloak-operator
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart defaults this to true, which creates a
    # ValidatingWebhookConfiguration plus a cert-manager Certificate. There is
    # no cert-manager in this cluster (TLS is terminated by host Traefik), so
    # leaving it on would leave the webhook wedged on a certificate that never
    # gets issued.
    enableWebhooks: false

    # Only reconcile CRs in this namespace. Cluster-scoped ClusterKeycloak /
    # ClusterKeycloakRealm resources are ignored, which keeps the operator's
    # RBAC and blast radius small. Flip to true if realm CRs ever need to live
    # next to the apps that consume them.
    clusterReconciliationEnabled: false

    # Legacy behaviour: sets ownerReferences on everything referencing a
    # Keycloak/KeycloakRealm, so deleting the connection CR cascades. Upstream
    # plans to default this off.
    enableOwnerRef: false

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi
