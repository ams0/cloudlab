---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twenty
  namespace: twenty
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "crm.vps.kubespaces.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # chart names the service <fullname>-server; fullnameOverride pins <fullname> to "twenty"
        - name: twenty-server
          port: 3000
