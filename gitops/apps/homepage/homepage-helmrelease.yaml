---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: flux-system
  labels:
    app: homepage
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: homepage
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: homepage
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      # Chart 2.1.0 pins appVersion v1.2.0; track the current release instead.
      tag: v1.4.5 # renovate: datasource=docker depName=ghcr.io/gethomepage/homepage

    # Homepage v1.x refuses any request whose Host header is not listed here.
    # Traefik forwards the original Host, so this must match the public name.
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: "home.vps.kubespaces.cloud"

    # Single node: a surging replica has nowhere to schedule and the rollout
    # stalls indefinitely. Replace the old pod instead.
    controller:
      strategy: Recreate
      rollingUpdate: null

    # Static link tiles only — no Kubernetes API access needed.
    enableRbac: false

    service:
      main:
        ports:
          http:
            port: 3000

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

    config:
      settings:
        title: CloudLab
        headerStyle: clean
        theme: dark
        color: slate
        layout:
          Platform:
            style: row
            columns: 3
          Automation:
            style: row
            columns: 3
          Observability:
            style: row
            columns: 3

      services:
        - Platform:
            - Keycloak:
                href: https://auth.vps.kubespaces.cloud
                description: Identity and access management (SSO, OIDC, SAML)
                icon: keycloak.png
            - Traefik:
                href: https://traefik.vps.kubespaces.cloud
                description: Host-level reverse proxy and TLS termination
                icon: traefik.png
        - Automation:
            - n8n:
                href: https://n8n.vps.kubespaces.cloud
                description: Workflow automation, queue mode with Postgres and Valkey
                icon: n8n.png
        - Observability:
            - Uptime Kuma:
                href: https://status.vps.kubespaces.cloud
                description: Service uptime monitoring and status page
                icon: uptime-kuma.png

      bookmarks:
        - Infrastructure:
            - Repository:
                - abbr: GH
                  href: https://github.com/ams0/cloudlab

      widgets:
        - resources:
            cpu: true
            memory: true
            disk: /
        - search:
            provider: duckduckgo
            target: _blank

      # Chart mounts these; empty is fine but the keys must exist.
      docker: {}
      kubernetes: {}
