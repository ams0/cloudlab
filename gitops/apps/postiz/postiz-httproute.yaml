---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: postiz
  namespace: postiz
spec:
  parentRefs:
    - name: gateway
      namespace: istio-system
      sectionName: http
  hostnames:
    - "postiz.vps.kubespaces.cloud"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: postiz
          port: 5000
