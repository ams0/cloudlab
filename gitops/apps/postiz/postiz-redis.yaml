---
# Cache/throttling only — workflows live in Temporal — so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: postiz
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine # renovate: datasource=docker depName=redis
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: postiz
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
