---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: opentodo
  namespace: flux-system
spec:
  interval: 1h
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/opentodoapp/charts/opentodo
  # The chart version IS the app version (chart 1.5.0 runs image 1.5.0).
  # Pinned: no down-migrations, so back up before bumping.
  ref:
    tag: "1.5.0"
