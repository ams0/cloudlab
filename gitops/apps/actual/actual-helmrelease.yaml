---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual
  namespace: flux-system
  labels:
    app: actual
spec:
  interval: 10m
  timeout: 5m
  targetNamespace: actual
  chart:
    spec:
      chart: actualbudget
      # Pinned rather than floating: on a single node an unattended chart bump
      # can change the rollout strategy underneath a SQLite app (see below).
      version: "1.9.5"
      sourceRef:
        kind: HelmRepository
        name: actual
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "26.10.0" # renovate: datasource=docker depName=actualbudget/actual-server
    ingress:
      enabled: false
    persistence:
      enabled: true
      existingClaim: actual-pvc
    # The chart defaults to maxUnavailable=0 / maxSurge=100%, which on an
    # upgrade starts the new pod before retiring the old one. Both would mount
    # the same RWO claim on this single node and run actual-server against the
    # same SQLite file concurrently -- a corruption risk, not just the usual
    # single-node surge stall. Recreate takes the old pod down first; the
    # seconds of downtime are the cheaper trade for a personal budget app.
    strategy:
      type: Recreate
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
