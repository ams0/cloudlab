---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: warpgate
  namespace: flux-system
  labels:
    app: warpgate
spec:
  interval: 10m
  timeout: 10m
  targetNamespace: warpgate
  dependsOn:
    - name: warpgate-database
  chart:
    spec:
      chart: ./helm/warpgate
      sourceRef:
        kind: GitRepository
        name: warpgate
        namespace: flux-system
      interval: 5m0s
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1

    # Self-signed pair generated by roles/flux. Required because Warpgate always
    # terminates TLS, and with overrides_config in play the setup step never
    # writes one (the config file already exists, so it skips).
    tls_cert_secret: warpgate-tls

    # ── HTTP only, for now ───────────────────────────────────────────────
    # Warpgate is a bastion and also speaks SSH, MySQL and Postgres, but all
    # three are raw TCP and this cluster only has HTTP ingress today
    # (Traefik :443 -> Istio gateway NodePort -> HTTPRoute). Those ports are
    # switched off rather than exposed on a service nothing can reach.
    # Turning SSH on later means a TCP listener on the Gateway plus a TCPRoute
    # (the experimental CRDs are already installed), a host firewall rule and
    # a matching OCI security-list rule.
    setup:
      enabled: true
      type: job
      http: 8888
      ssh: 0
      mysql: 0
      pgsql: 0
      kubernetes: 0
      recordSessions: true
      # CNPG owns the database. The password is substituted from the
      # environment so the DSN never appears in Git.
      databaseUrl: "postgres://warpgate:$WARPGATE_DB_PASSWORD@warpgate-warpgate-database-cluster-rw:5432/warpgate"
      # The init container performs the $VAR substitution into warpgate.yaml
      # using `printenv` under `set -e`, and it takes its environment from THIS
      # map — not the main container's envFromSecret. Every variable listed in
      # config_env_var_replace must therefore appear here too, or the init
      # container exits 1 with no log output at all.
      envFromSecret:
        WARPGATE_ADMIN_PASSWORD: "warpgate-secret/adminPassword"
        WARPGATE_DB_PASSWORD: "warpgate-warpgate-database-cluster-app/password"
        WARPGATE_SSO_CLIENT_SECRET: "warpgate-sso/clientSecret"

    service:
      type: ClusterIP
      ports:
        http: 8888
        ssh: 0
        mysql: 0
        pgsql: 0
        kubernetes: 0

    # ── Routing ──────────────────────────────────────────────────────────
    # The chart emits a Gateway API HTTPRoute natively, so there is no separate
    # {app}-httproute.yaml here — one fewer place for the backend name to drift.
    ingress:
      enabled: false
    httpRoute:
      enabled: true
      parentRefs:
        - name: gateway
          namespace: istio-system
          sectionName: http
      hostnames:
        - warpgate.vps.kubespaces.cloud

    # ── Config ───────────────────────────────────────────────────────────
    # A full config override, because SSO providers have no values-level knob.
    # Based on the chart's own generated config (see warpgate.config in
    # _helpers.tpl) with sso_providers and external_host added.
    #
    # $VARS listed in config_env_var_replace are substituted from the pod
    # environment at startup, which keeps both the database password and the
    # OIDC client secret out of the repo.
    config_env_var_replace: "WARPGATE_DB_PASSWORD WARPGATE_SSO_CLIENT_SECRET"
    overrides_config: |
      database_url: "postgres://warpgate:$WARPGATE_DB_PASSWORD@warpgate-warpgate-database-cluster-rw:5432/warpgate"
      # TOP-LEVEL, not under http. construct_external_url() reads
      # store.external_host; the http.external_host key is a different thing
      # (it only appears in a DB query for target options). With it nested, any
      # code path that builds a URL without an inbound request — the SSO start
      # endpoint, the session cookie domain — fails with
      # "no valid Host header found and `external_host` config option is not set".
      external_host: warpgate.vps.kubespaces.cloud
      http:
        listen: "0.0.0.0:8888"
        certificate: /data/tls.certificate.pem
        key: /data/tls.key.pem
      sso_providers:
        - name: keycloak
          label: Kubespaces
          provider:
            type: custom
            client_id: warpgate
            client_secret: "$WARPGATE_SSO_CLIENT_SECRET"
            issuer_url: https://auth.vps.kubespaces.cloud/realms/kubespaces
            scopes:
              - openid
              - profile
              - email

    envFromSecret:
      WARPGATE_DB_PASSWORD: "warpgate-warpgate-database-cluster-app/password"
      WARPGATE_SSO_CLIENT_SECRET: "warpgate-sso/clientSecret"
      # Encrypts stored target credentials at rest.
      WARPGATE_ENCRYPTION_KEY: "warpgate-secret/encryptionKey"

    data:
      pvc:
        enabled: true
        claimName: warpgate-pvc

    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 768Mi
