# Variables for oracle_hosts group
---
# System configuration
timezone: "UTC"
locale: "en_US.UTF-8"

# Docker configuration
docker_users:
  - "{{ ansible_user }}"

# Loki credentials for the public push endpoint (used by host-level
# log shippers like the Traefik Docker logging driver).
loki_username: "{{ vault_loki_username }}"
loki_password: "{{ vault_loki_password }}"

# Borg Backup configuration
borg_repository: "{{ vault_borg_repository }}"
borg_ssh_user: "{{ vault_borg_ssh_user }}"
borg_ssh_host: "{{ vault_borg_ssh_host }}"
borg_ssh_host_key: "feynman.rhino-butterfly.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMUtd+clmg3FHLP9SpSNNda7F0rdRTat3BvEA0LovbX+"
borg_passphrase: "{{ vault_borg_passphrase }}"
borg_ssh_key: "/home/ubuntu/.ssh/nas"  # SSH key for Mac Mini
borg_version: "1.4.1"  # Latest stable with ARM64 support
borg_remote_path: "/opt/homebrew/bin/borg"  # Homebrew install on Mac Mini (Apple Silicon)
borg_backup_paths:
  - /etc
  - /home
  - /root
  - /var/log
  - /opt/local-path-provisioner
  - /usr/local
  - /var/lib/docker
borg_exclude_patterns:
  - "*.cache"
  - "*/cache/*"
  - "*/fonts/*"
  - "*/tmp/*"
  - "*/temp/*"
  - "*.tmp"
  - "*.temp"
  - "*/.git/*"
  - "*/node_modules/*"
  - "*/__pycache__/*"
  - "*/venv/*"
  - "*/virtualenv/*"
  - "*/.vscode-server/*"
  - "*/.npm/*"
  - "*/.claude/*"

# Tailscale configuration
tailscale_auth_key: "{{ vault_tailscale_auth_key }}"
tailscale_hostname: "oracle-{{ inventory_hostname }}"

# Datadog configuration
datadog_api_key: "{{ vault_datadog_api_key }}"
datadog_hostname: "oracle-vps"
datadog_tags:
  - "env:production"
  - "role:oracle-host"
  - "managed_by:ansible"
datadog_logs_enabled: true
datadog_process_agent_enabled: true
datadog_apm_enabled: false

# Tailscale operator configuration
tailscale_operator_oauth_client_id: "{{ vault_tailscale_operator_oauth_client_id }}"
tailscale_operator_oauth_client_secret: "{{ vault_tailscale_operator_oauth_client_secret }}"

# Omni configuration
omni_oidc_client_secret: "{{ vault_omni_oidc_client_secret }}"
omni_etcd_encryption_key: "{{ vault_omni_etcd_encryption_key }}"

# Alarik configuration
alarik_admin_username: "{{ vault_alarik_admin_username }}"
alarik_admin_password: "{{ vault_alarik_admin_password }}"
alarik_jwt_key: "{{ vault_alarik_jwt_key }}"
alarik_default_access_key: "{{ vault_alarik_default_access_key }}"
alarik_default_secret_key: "{{ vault_alarik_default_secret_key }}"

# RustFS configuration
rustfs_access_key: "{{ vault_rustfs_access_key }}"
rustfs_secret_key: "{{ vault_rustfs_secret_key }}"

# SMB mount configuration (Mac Mini)
smb_password: "{{ vault_smb_password }}"

# Velero S3 credentials (Mac Mini RustFS)
velero_s3_access_key: "{{ vault_velero_s3_access_key }}"
velero_s3_secret_key: "{{ vault_velero_s3_secret_key }}"
# Public key of OpenBao's SSH CA (vault.vps.kubespaces.cloud, mount `ssh`).
# Hosts trust it via TrustedUserCAKeys so Warpgate can log in with 5-minute
# certificates OpenBao signs per session. Public — safe in Git. Refresh with:
#   curl -s https://vault.vps.kubespaces.cloud/v1/ssh/public_key
warpgate_ssh_ca_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGkwynraGZ2wHuRfH3E2ZnFVCG8XYBndN6OuLOS9nfEk"

# Unix accounts reachable through the Warpgate target "cloudlab" (empty target
# username → Warpgate login name = unix account = certificate principal).
# Each name must ALSO be a Warpgate user and be listed in the OpenBao role's
# allowed_users (ssh/roles/warpgate), or OpenBao refuses to sign.
warpgate_users:
  - name: alessandro
    sudo: true
